<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page moved · Light–Matter Intelligence Lab</title>
<meta name="robots" content="noindex">
<script>
  // Old addresses from the previous site go to the matching section of the new one-page site.
  (function () {
    var p = location.pathname.toLowerCase();
    var map = [
      [/^\/(publications?|publication\/|talks?|talk\/|patents?|cv|cv-json|year-archive)/, "#publications"],
      [/^\/(lab-members|people|members|lab-users|principal-investigator)/, "#people"],
      [/^\/(projects?|research|lab-capabilities|lab_capabilities|lab-instruments)/, "#research"],
      [/^\/(contact|about)/, "#contact"]
    ];
    var target = "/";
    for (var i = 0; i < map.length; i++) if (map[i][0].test(p)) { target = "/" + map[i][1]; break; }
    location.replace(target);
  })();
</script>
<meta http-equiv="refresh" content="3; url=/">

  body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;

</style>
